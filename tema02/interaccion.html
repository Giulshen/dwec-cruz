<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interacción</title>

  <!-- CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Iconos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Nuestro CSS -->
  <link href="css/estilos.css" rel="stylesheet">
</head>

<body>

  <!-- Barra de navegación -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Giulshen Hueso Cruz</a>

      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Navegadores</a>
        <a class="nav-link active" href="interaccion.html">Interacción</a>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container mt-4">

    <div class="row">
      <div class="col">

        <h1>Interacción con JavaScript</h1>

        <p>
          En esta página voy a utilizar JavaScript para interactuar con el
          usuario y mostrar información en la consola del navegador.
        </p>

        <!-- Componente Bootstrap: tarjeta -->
        <div class="card mt-4">
          <div class="card-body">

            <h2 class="card-title">Prueba los botones</h2>

            <p class="card-text">
              Cada botón realiza una acción diferente utilizando JavaScript.
            </p>

            <button id="btnSaludar" class="btn btn-primary me-2">
              <i class="bi bi-hand-wave"></i>
              Saludar
            </button>

            <button id="btnError" class="btn btn-danger me-2">
              <i class="bi bi-exclamation-triangle"></i>
              Simular un error
            </button>

            <button id="btnNavegador" class="btn btn-success">
              <i class="bi bi-globe"></i>
              ¿Qué navegador soy?
            </button>

          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Nuestro JavaScript -->
  <script src="js/app.js"></script>

</body>
</html>
